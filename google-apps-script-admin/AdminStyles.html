<style>
  :root {
    --admin-sky: #dff5ff;
    --admin-cloud: #f6fbff;
    --admin-white: #ffffff;
    --admin-blue: #315a78;
    --admin-text: #587083;
    --admin-border: #cbe6f3;
    --admin-green: #3f8f5a;
    --admin-green-soft: #e8f6ed;
    --admin-red: #b75058;
    --admin-red-soft: #fdecef;
    --admin-shadow: 0 0.75rem 2rem rgb(49 90 120 / 10%);
    --admin-radius: 1rem;
  }

  * { box-sizing: border-box; }

  body {
    min-width: 20rem;
    margin: 0;
    background: var(--admin-cloud);
    color: var(--admin-text);
    font-family: Arial, sans-serif;
    line-height: 1.5;
  }

  button,
  input,
  select { font: inherit; }

  .admin-shell {
    width: min(72rem, 100%);
    margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }

  .admin-header,
  .panel-header,
  .filters {
    display: flex;
    gap: 1rem;
  }

  .admin-header {
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.5rem;
  }

  .admin-eyebrow {
    margin: 0 0 0.25rem;
    color: var(--admin-green);
    font-size: 0.875rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  h1,
  h2,
  p { margin-top: 0; }

  h1,
  h2 { color: var(--admin-blue); }

  h1 { margin-bottom: 0.25rem; font-size: clamp(1.75rem, 4vw, 2.5rem); }
  h2 { margin-bottom: 0.25rem; font-size: 1.25rem; }

  .button {
    min-height: 2.75rem;
    padding: 0.75rem 1rem;
    border: 1px solid transparent;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 700;
  }

  .button--primary { background: var(--admin-blue); color: var(--admin-white); }
  .button:disabled { cursor: wait; opacity: 0.7; }
  .button:focus-visible,
  input:focus-visible,
  select:focus-visible { outline: 3px solid var(--admin-green); outline-offset: 2px; }

  .update-status { min-height: 1.5rem; margin-bottom: 1.5rem; font-size: 0.875rem; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .stat-card,
  .responses-panel {
    border: 1px solid var(--admin-border);
    border-radius: var(--admin-radius);
    background: var(--admin-white);
    box-shadow: var(--admin-shadow);
  }

  .stat-card { padding: 1.25rem; }
  .stat-card span { display: block; font-size: 0.875rem; }
  .stat-card strong { display: block; margin-top: 0.25rem; color: var(--admin-blue); font-size: 2rem; }
  .stat-card--confirmed strong { color: var(--admin-green); }
  .stat-card--absent strong { color: var(--admin-red); }

  .responses-panel { padding: 1.5rem; }
  .panel-header { align-items: end; justify-content: space-between; margin-bottom: 1.5rem; }
  .panel-header p { margin-bottom: 0; }
  .filters { align-items: end; flex-wrap: wrap; }
  .field { display: grid; gap: 0.375rem; }
  .field label { color: var(--admin-blue); font-size: 0.875rem; font-weight: 700; }
  input,
  select { min-height: 2.75rem; padding: 0.5rem 0.75rem; border: 1px solid var(--admin-border); border-radius: 0.5rem; background: var(--admin-white); color: var(--admin-blue); }

  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  caption { padding-bottom: 0.75rem; color: var(--admin-text); text-align: left; }
  th,
  td { padding: 0.875rem; border-bottom: 1px solid var(--admin-border); vertical-align: middle; }
  th { position: sticky; top: 0; z-index: 1; background: var(--admin-sky); color: var(--admin-blue); }
  tbody tr:last-child td { border-bottom: 0; }

  .status { display: inline-flex; padding: 0.25rem 0.625rem; border-radius: 999px; font-size: 0.875rem; font-weight: 700; }
  .status--confirmed { background: var(--admin-green-soft); color: var(--admin-green); }
  .status--absent { background: var(--admin-red-soft); color: var(--admin-red); }
  .status--unknown { background: var(--admin-sky); color: var(--admin-blue); }

  .loading-state,
  .empty-state,
  .error-state { padding: 1.5rem; border-radius: 0.75rem; text-align: center; }
  .loading-state { background: var(--admin-sky); }
  .empty-state { background: var(--admin-cloud); }
  .error-state { background: var(--admin-red-soft); color: var(--admin-red); }

  @media (max-width: 48rem) {
    .admin-header,
    .panel-header { align-items: stretch; flex-direction: column; }
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .button { width: 100%; }
  }

  @media (max-width: 30rem) {
    .admin-shell { padding-inline: 0.75rem; }
    .stats-grid { grid-template-columns: minmax(0, 1fr); }
    .responses-panel { padding: 1rem; }
    th,
    td { padding: 0.75rem 0.5rem; }
  }
</style>
