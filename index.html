<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Laura • 1 Aninho</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <header class="hero">
      <div class="hero__background" aria-hidden="true">
        <div class="hero__sun"></div>
        <div class="hero__clouds">
          <div class="hero__cloud hero__cloud--1"></div>
          <div class="hero__cloud hero__cloud--2"></div>
          <div class="hero__cloud hero__cloud--3"></div>
        </div>
        <div class="hero__stars"></div>
      </div>

      <div class="container">
        <div class="hero__content">
          <div class="badge hero__badge"></div>
          <h1 class="section-title hero__title"></h1>
          <p class="section-subtitle hero__subtitle"></p>
          <p class="hero__description"></p>
          <div class="hero__actions"></div>
        </div>

        <div class="hero__image">
          <div class="hero__photo">
            <div class="hero__photo-frame"></div>
            <div class="hero__photo-glow"></div>
          </div>
          <div class="hero__decorations"></div>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true"></div>
    </header>

    <main></main>

    <footer></footer>

    <script src="js/app.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/music.js"></script>
    <script src="js/rsvp.js"></script>
    <script src="js/scrollReveal.js"></script>
  </body>
</html>
