<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Laura • 1 Aninho</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <header class="hero">
      <div class="hero__background" aria-hidden="true">
        <div class="hero__sun"></div>
        <div class="hero__clouds">
          <div class="hero__cloud hero__cloud--1"></div>
          <div class="hero__cloud hero__cloud--2"></div>
          <div class="hero__cloud hero__cloud--3"></div>
        </div>
        <div class="hero__stars"></div>
      </div>

      <div class="container">
        <div class="hero__content">
          <p class="badge hero__badge hero__eyebrow">Um dia para celebrar</p>
          <h1 class="section-title hero__title">
            Maria Laura
            <span class="hero__highlight">faz 1 aninho</span>
          </h1>
          <p class="section-subtitle hero__subtitle">Uma comemoração doce, leve e cheia de carinho.</p>
          <p class="hero__description">Venha viver conosco um momento especial e celebrar o primeiro ano da Maria Laura.</p>
          <div class="hero__actions">
            <a class="btn btn-primary" href="#confirmar">Confirmar presença</a>
          </div>
        </div>

        <div class="hero__image">
          <div class="hero__photo-wrapper">
            <div class="hero__photo-glow" aria-hidden="true"></div>
            <div class="hero__photo-frame">
              <img class="hero__photo" src="https://placehold.co/720x900/dff5ff/315a78?text=Maria+Laura" alt="Espaço reservado para a foto da Maria Laura" width="720" height="900">
            </div>
            <p class="badge hero__theme-badge">1 aninho</p>
          </div>
          <div class="hero__decorations"></div>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true"></div>
    </header>

    <main></main>

    <footer></footer>

    <script src="js/app.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/music.js"></script>
    <script src="js/rsvp.js"></script>
    <script src="js/scrollReveal.js"></script>
  </body>
</html>
